<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Grind | Habits</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="dashboard-page">


        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="sidebar-brand">

                <span class="brand-mark">
                    TG
                </span>

                <div>

                    <h2>The Grind</h2>

                    <p>Stay consistent.</p>

                </div>

            </div>


            <nav class="sidebar-nav">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="habits.html" class="active">
                    Habits
                </a>

                <a href="progress.html">
                    Progress
                </a>

                <a href="history.html">
                    History
                </a>

            </nav>


            <button
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </aside>



        <!-- ================= MAIN CONTENT ================= -->

        <main class="dashboard-main">


            <!-- Header -->

            <header class="dashboard-header">

                <p class="eyebrow">
                    YOUR HABITS
                </p>

                <h1>
                    Daily habits
                </h1>

                <p class="dashboard-subtitle">
                    Stay consistent and make today count.
                </p>

            </header>



            <!-- ================= STATISTICS ================= -->

            <section class="stats-grid">


                <div class="stat-card">

                    <p>
                        Total Habits
                    </p>

                    <h2 id="totalHabits">
                        0
                    </h2>

                    <span>
                        Active habits
                    </span>

                </div>


                <div class="stat-card">

                    <p>
                        Completed Today
                    </p>

                    <h2 id="completedToday">
                        0
                    </h2>

                    <span>
                        Keep going
                    </span>

                </div>


                <div class="stat-card">

                    <p>
                        Daily Goal
                    </p>

                    <h2 id="dailyGoal">
                        0%
                    </h2>

                    <span>
                        Today's progress
                    </span>

                </div>


            </section>



            <!-- ================= ADD HABIT ================= -->

            <section class="habits-section">


                <div class="section-heading">

                    <div>

                        <p class="eyebrow">
                            CREATE
                        </p>

                        <h2>
                            Add a new habit
                        </h2>

                    </div>

                </div>


                <div class="progress-card">


                    <form id="addHabitForm">


                        <!-- Habit name -->

                        <div class="form-group">

                            <label for="habitName">
                                Habit name
                            </label>

                            <input
                                type="text"
                                id="habitName"
                                placeholder="e.g. Code for 30 Minutes"
                                required
                            >

                        </div>



                        <!-- Description -->

                        <div class="form-group">

                            <label for="habitDescription">
                                Description
                            </label>

                            <input
                                type="text"
                                id="habitDescription"
                                placeholder="e.g. Practice coding every day"
                                required
                            >

                        </div>



                        <!-- Icon -->

                     <div class="form-group">

    <label>
        Choose an icon
    </label>

    <input
        type="hidden"
        id="habitIcon"
        value="🎯"
        required
    >

    <div class="icon-picker">

        <button type="button" class="icon-option" data-icon="💧">💧</button>
        <button type="button" class="icon-option" data-icon="🏃">🏃</button>
        <button type="button" class="icon-option" data-icon="📖">📖</button>
        <button type="button" class="icon-option" data-icon="🧘">🧘</button>
        <button type="button" class="icon-option" data-icon="📚">📚</button>
        <button type="button" class="icon-option" data-icon="💻">💻</button>
        <button type="button" class="icon-option" data-icon="🎨">🎨</button>
        <button type="button" class="icon-option" data-icon="🏋️">🏋️</button>
        <button type="button" class="icon-option" data-icon="☕">☕</button>
        <button type="button" class="icon-option" data-icon="🎵">🎵</button>
        <button type="button" class="icon-option" data-icon="🥗">🥗</button>
        <button type="button" class="icon-option" data-icon="💤">💤</button>
        <button type="button" class="icon-option" data-icon="🧹">🧹</button>
        <button type="button" class="icon-option" data-icon="✍️">✍️</button>
        <button type="button" class="icon-option" data-icon="🧠">🧠</button>
        <button type="button" class="icon-option" data-icon="🎯">🎯</button>

    </div>

</div>   
                        <!-- Submit -->

                        <button
                            type="submit"
                            class="habit-status completed"
                        >
                            + Add Habit
                        </button>


                    </form>


                    <p
                        id="habitMessage"
                        style="margin-top:15px;"
                    ></p>


                </div>


            </section>



            <!-- ================= TODAY'S HABITS ================= -->

            <section class="habits-section">


                <div class="section-heading">

                    <div>

                        <p class="eyebrow">
                            TODAY
                        </p>

                        <h2>
                            Your habits
                        </h2>

                    </div>

                </div>


                <div
                    id="habitList"
                    class="habit-list"
                >

                    <p id="loadingMessage">
                        Loading habits...
                    </p>

                </div>


            </section>


        </main>


    </div>



    <script src="script.js/habits.js"></script>

</body>

</html>
